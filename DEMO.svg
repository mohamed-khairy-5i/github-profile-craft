<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#f5f3ee"/>
<text x="64" y="66" fill="#284744" font-family="DejaVu Sans" font-size="16" font-weight="bold" letter-spacing="2">REPOPROOFLOOM</text>
<text x="64" y="123" fill="#122d2b" font-family="DejaVu Sans" font-size="42" font-weight="bold">Show the work. Skip the filler.</text>
<text x="64" y="161" fill="#4c625f" font-family="DejaVu Sans" font-size="19">Illustrative synthetic example. Not a recorded run or a live profile.</text>
<rect x="64" y="203" width="400" height="451" rx="18" fill="#ffffff" stroke="#d4dcd6"/>
<rect x="492" y="203" width="644" height="451" rx="18" fill="#ffffff" stroke="#a8c5b7"/>
<text x="90" y="247" fill="#7e554e" font-family="DejaVu Sans" font-size="14" font-weight="bold" letter-spacing="1">BEFORE / SUPPLIED PROFILE</text>
<text x="90" y="298" fill="#233d39" font-family="DejaVu Sans" font-size="27" font-weight="bold">Hi, I'm Noor.</text>
<text x="90" y="339" fill="#67766f" font-family="DejaVu Sans" font-size="19">Passionate developer</text>
<text x="90" y="370" fill="#67766f" font-family="DejaVu Sans" font-size="19">changing the future.</text>
<path d="M90 410 H438" stroke="#e5e9e3"/>
<text x="90" y="451" fill="#67766f" font-family="DejaVu Sans" font-size="18">A visitor still has to guess:</text>
<text x="90" y="487" fill="#67766f" font-family="DejaVu Sans" font-size="18">What does Noor build?</text>
<text x="90" y="519" fill="#67766f" font-family="DejaVu Sans" font-size="18">Which project should I open?</text>
<text x="90" y="551" fill="#67766f" font-family="DejaVu Sans" font-size="18">What can I actually try?</text>
<text x="520" y="247" fill="#2d6658" font-family="DejaVu Sans" font-size="14" font-weight="bold" letter-spacing="1">AFTER / ILLUSTRATIVE DRAFT</text>
<text x="520" y="298" fill="#173d34" font-family="DejaVu Sans" font-size="27" font-weight="bold">Small CLI tools. Specific problems.</text>
<text x="520" y="345" fill="#284b41" font-family="DejaVu Sans" font-size="23" font-weight="bold">ClipCheck</text>
<text x="520" y="384" fill="#465f54" font-family="DejaVu Sans" font-size="19">Find exact duplicate lines in a folder's .txt files.</text>
<text x="520" y="416" fill="#465f54" font-family="DejaVu Sans" font-size="19">Print matches with filenames. Leave files unchanged.</text>
<rect x="520" y="445" width="586" height="63" rx="9" fill="#edf4ee"/>
<text x="540" y="484" fill="#204b3d" font-family="DejaVu Sans Mono" font-size="20">python clipcheck.py ./notes</text>
<text x="520" y="549" fill="#465f54" font-family="DejaVu Sans" font-size="17">Exact-line matching. Immediate files only.</text>
<text x="520" y="580" fill="#465f54" font-family="DejaVu Sans" font-size="17">Supplied source summary. Test runs not verified.</text>
<text x="520" y="618" fill="#2d6658" font-family="DejaVu Sans" font-size="17" font-weight="bold">One project. A useful behavior. A real next step.</text>
<rect x="64" y="688" width="1072" height="80" rx="14" fill="#193e35"/>
<text x="90" y="722" fill="#f4f9f2" font-family="DejaVu Sans" font-size="18" font-weight="bold">Finished Markdown + evidence ledger + bio / pins / project copy</text>
<text x="90" y="749" fill="#c7ded0" font-family="DejaVu Sans" font-size="16">Draft first. No invented metrics. No profile changes without approval. No star promises.</text>
</svg>
